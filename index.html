<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colonel Blotto Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .chart-bar { transition: width 0.5s ease-in-out; }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Firebase Initialization Module -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "dummy", authDomain: "dummy", projectId: "dummy", storageBucket: "dummy", messagingSenderId: "dummy", appId: "dummy"
        };
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Expose Firebase and API to window for React to use
        window.firebaseApp = { app, auth, db, appId, initialAuthToken };
        window.firebaseAPI = { signInAnonymously, signInWithCustomToken, collection, onSnapshot, addDoc, serverTimestamp };
        
        window.dispatchEvent(new Event('firebase-ready'));
    </script>

    <!-- React Application -->
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const App = () => {
            const [isReady, setIsReady] = useState(false);
            const [user, setUser] = useState(null);
            const [allocations, setAllocations] = useState([]);
            
            const [currentView, setCurrentView] = useState('login'); // 'login', 'alloc', 'results'
            const [baseUsername, setBaseUsername] = useState('');
            const [errorMsg, setErrorMsg] = useState('');
            
            // Wait for Firebase to initialize
            useEffect(() => {
                const initAuth = async () => {
                    if (!window.firebaseApp) return;
                    const { auth, initialAuthToken } = window.firebaseApp;
                    const { signInWithCustomToken, signInAnonymously } = window.firebaseAPI;
                    
                    try {
                        if (initialAuthToken) {
                            await signInWithCustomToken(auth, initialAuthToken);
                        } else {
                            await signInAnonymously(auth);
                        }
                        setUser(auth.currentUser);
                        setIsReady(true);
                    } catch (err) {
                        console.error("Auth Error:", err);
                        setErrorMsg("Failed to authenticate with database.");
                    }
                };

                if (window.firebaseApp) {
                    initAuth();
                } else {
                    window.addEventListener('firebase-ready', initAuth);
                    return () => window.removeEventListener('firebase-ready', initAuth);
                }
            }, []);

            // Subscribe to Allocations
            useEffect(() => {
                if (!isReady || !user) return;
                
                const { db, appId } = window.firebaseApp;
                const { collection, onSnapshot } = window.firebaseAPI;
                
                const q = collection(db, 'artifacts', appId, 'public', 'data', 'blotto_allocations');
                
                const unsubscribe = onSnapshot(q, (snapshot) => {
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    // Sort primarily by timestamp to keep order logical
                    data.sort((a, b) => (a.timestamp?.seconds || 0) - (b.timestamp?.seconds || 0));
                    setAllocations(data);
                }, (err) => {
                    console.error("Snapshot error", err);
                    setErrorMsg("Lost connection to live database.");
                });

                return () => unsubscribe();
            }, [isReady, user]);

            const handleLogin = (e) => {
                e.preventDefault();
                if (!baseUsername.trim()) {
                    setErrorMsg("Please enter a username.");
                    return;
                }
                setErrorMsg("");
                // We'll stay on login view but enable navigation
            };

            if (!isReady) {
                return (
                    <div className="min-h-screen flex items-center justify-center">
                        <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600"></div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen p-4 md:p-8 flex justify-center">
                    <div className="max-w-xl w-full bg-white shadow-xl rounded-2xl overflow-hidden flex flex-col h-full md:h-auto">
                        
                        {/* Header */}
                        <div className="bg-indigo-600 text-white p-4 text-center relative shadow-md z-10">
                            {currentView !== 'login' && (
                                <button 
                                    onClick={() => setCurrentView('login')}
                                    className="absolute left-4 top-1/2 transform -translate-y-1/2 text-white bg-indigo-700 hover:bg-indigo-800 px-3 py-1 rounded text-sm transition"
                                >
                                    &larr; Back
                                </button>
                            )}
                            <h1 className="text-xl md:text-2xl font-bold">5-Battlefield Blotto</h1>
                            {baseUsername && currentView !== 'login' && (
                                <p className="text-indigo-200 text-sm mt-1">Playing as: {baseUsername}</p>
                            )}
                        </div>

                        {/* Error Message */}
                        {errorMsg && (
                            <div className="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 m-4 rounded relative" role="alert">
                                <span className="block sm:inline">{errorMsg}</span>
                                <span className="absolute top-0 bottom-0 right-0 px-4 py-3 cursor-pointer" onClick={() => setErrorMsg('')}>
                                    &times;
                                </span>
                            </div>
                        )}

                        {/* Views */}
                        <div className="flex-1 overflow-y-auto p-4 md:p-6 bg-gray-50">
                            {currentView === 'login' && (
                                <LoginView 
                                    baseUsername={baseUsername}
                                    setBaseUsername={setBaseUsername}
                                    onNavigate={setCurrentView}
                                    errorMsg={errorMsg}
                                    setErrorMsg={setErrorMsg}
                                />
                            )}
                            {currentView === 'alloc' && (
                                <AllocationView 
                                    baseUsername={baseUsername}
                                    allocations={allocations}
                                    onComplete={() => setCurrentView('results')}
                                    setErrorMsg={setErrorMsg}
                                />
                            )}
                            {currentView === 'results' && (
                                <ResultsView 
                                    baseUsername={baseUsername}
                                    allocations={allocations}
                                />
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        /* --------------------------------------------------------
           LOGIN VIEW
           -------------------------------------------------------- */
        const LoginView = ({ baseUsername, setBaseUsername, onNavigate, setErrorMsg }) => {
            const handleNav = (target) => {
                if (!baseUsername.trim()) {
                    setErrorMsg("Please enter a username first.");
                    return;
                }
                setErrorMsg("");
                onNavigate(target);
            };

            return (
                <div className="flex flex-col items-center justify-center space-y-8 py-8">
                    <div className="w-full text-center">
                        <h2 className="text-2xl font-semibold text-gray-800 mb-2">Welcome Commander</h2>
                        <p className="text-gray-600 mb-6">Enter your alias to join the battlefield.</p>
                        <input
                            type="text"
                            placeholder="Enter Username"
                            className="w-full text-center text-lg px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm"
                            value={baseUsername}
                            onChange={(e) => setBaseUsername(e.target.value)}
                            onKeyDown={(e) => { if(e.key === 'Enter') handleNav('alloc') }}
                        />
                    </div>
                    
                    <div className="w-full flex flex-col space-y-4">
                        <button 
                            onClick={() => handleNav('alloc')}
                            className="w-full bg-indigo-600 text-white font-bold py-3 px-4 rounded-xl shadow-lg hover:bg-indigo-700 transition transform hover:-translate-y-1"
                        >
                            Enter New Allocation
                        </button>
                        <button 
                            onClick={() => handleNav('results')}
                            className="w-full bg-white text-indigo-600 font-bold py-3 px-4 rounded-xl shadow-md border border-indigo-200 hover:bg-indigo-50 transition"
                        >
                            View Results
                        </button>
                    </div>

                    <div className="text-sm text-gray-500 text-center max-w-xs pt-4 border-t border-gray-200">
                        Distribute 50 units across 5 battlefields. Outsmart your opponents to win points!
                    </div>
                </div>
            );
        };

        /* --------------------------------------------------------
           ALLOCATION VIEW
           -------------------------------------------------------- */
        const AllocationView = ({ baseUsername, allocations, onComplete, setErrorMsg }) => {
            const [units, setUnits] = useState([0, 0, 0, 0, 0]);
            const [isSubmitting, setIsSubmitting] = useState(false);
            
            const totalUsed = units.reduce((a, b) => a + b, 0);
            const remaining = 50 - totalUsed;
            
            const handleUnitChange = (index, value) => {
                let num = parseInt(value) || 0;
                if (num < 0) num = 0;
                
                const newUnits = [...units];
                newUnits[index] = num;
                setUnits(newUnits);
            };

            const handleSubmit = async () => {
                if (remaining !== 0) {
                    setErrorMsg(`You must allocate exactly 50 units. You have ${Math.abs(remaining)} ${remaining > 0 ? 'remaining' : 'too many'}.`);
                    return;
                }
                
                setIsSubmitting(true);
                setErrorMsg("");

                try {
                    const { db, appId } = window.firebaseApp;
                    const { collection, addDoc, serverTimestamp } = window.firebaseAPI;
                    
                    // Determine the next index for the username
                    const userAllocs = allocations.filter(a => 
                        a.baseUsername?.toLowerCase() === baseUsername.toLowerCase()
                    );
                    const newIndex = userAllocs.length + 1;
                    const finalUsername = `${baseUsername}_${newIndex}`;

                    const payload = {
                        baseUsername: baseUsername,
                        username: finalUsername,
                        allocation: units,
                        timestamp: serverTimestamp()
                    };

                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'blotto_allocations'), payload);
                    
                    onComplete();
                } catch (err) {
                    console.error("Submission failed:", err);
                    setErrorMsg("Failed to submit allocation.");
                    setIsSubmitting(false);
                }
            };

            return (
                <div className="space-y-6 pb-20 md:pb-0">
                    <div className={`sticky top-0 -mx-4 md:mx-0 p-4 rounded-xl shadow-md text-center transition-colors duration-300 z-10 ${remaining === 0 ? 'bg-green-100 text-green-800 border border-green-300' : remaining < 0 ? 'bg-red-100 text-red-800 border border-red-300' : 'bg-blue-100 text-blue-800 border border-blue-300'}`}>
                        <div className="text-sm font-semibold uppercase tracking-wide opacity-80">Remaining Units</div>
                        <div className="text-4xl font-bold">{remaining}</div>
                    </div>

                    <div className="space-y-3">
                        {[1, 2, 3, 4, 5].map((val, idx) => (
                            <div key={idx} className="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex items-center justify-between">
                                <div>
                                    <h3 className="font-bold text-gray-800">Battlefield {idx + 1}</h3>
                                    <p className="text-sm text-indigo-600 font-semibold text-gray-500">Value: {val} {val===1 ? 'Point':'Points'}</p>
                                </div>
                                <div>
                                    <input 
                                        type="number" 
                                        min="0"
                                        max="50"
                                        pattern="[0-9]*"
                                        className="w-24 text-center text-xl p-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50 font-bold text-indigo-900"
                                        value={units[idx] || ''}
                                        onChange={(e) => handleUnitChange(idx, e.target.value)}
                                        onFocus={(e) => e.target.select()}
                                    />
                                </div>
                            </div>
                        ))}
                    </div>

                    <button 
                        onClick={handleSubmit}
                        disabled={isSubmitting || remaining !== 0}
                        className={`w-full py-4 rounded-xl font-bold text-lg shadow-lg transition transform ${
                            remaining === 0 && !isSubmitting
                            ? 'bg-green-500 hover:bg-green-600 text-white hover:-translate-y-1'
                            : 'bg-gray-300 text-gray-500 cursor-not-allowed'
                        }`}
                    >
                        {isSubmitting ? 'Deploying...' : 'Deploy Units'}
                    </button>
                </div>
            );
        };

        /* --------------------------------------------------------
           RESULTS VIEW
           -------------------------------------------------------- */
        const ResultsView = ({ baseUsername, allocations }) => {
            const userAllocs = useMemo(() => {
                return allocations.filter(a => a.baseUsername?.toLowerCase() === baseUsername.toLowerCase());
            }, [allocations, baseUsername]);

            const [selectedId, setSelectedId] = useState('');

            // Auto-select the most recent allocation when loading
            useEffect(() => {
                if (userAllocs.length > 0 && !selectedId) {
                    setSelectedId(userAllocs[userAllocs.length - 1].id);
                }
            }, [userAllocs, selectedId]);

            const selectedAlloc = useMemo(() => {
                return userAllocs.find(a => a.id === selectedId) || null;
            }, [userAllocs, selectedId]);

            const stats = useMemo(() => {
                if (!selectedAlloc) return null;
                
                const otherAllocs = allocations.filter(a => a.id !== selectedAlloc.id);
                
                let standard = { w: 0, l: 0, t: 0, total: otherAllocs.length };
                let modified = { w: 0, l: 0, t: 0, total: otherAllocs.length };
                let allVsAllScore = 0;

                const myArr = selectedAlloc.allocation;

                // 1. All-vs-All Pre-calculation
                // Find the max units for each battlefield across EVERYONE
                const maxUnits = [0, 0, 0, 0, 0];
                allocations.forEach(a => {
                    for(let i=0; i<5; i++) {
                        if (a.allocation[i] > maxUnits[i]) maxUnits[i] = a.allocation[i];
                    }
                });

                // Count how many people tied for the max for each battlefield
                const maxTieCounts = [0, 0, 0, 0, 0];
                allocations.forEach(a => {
                    for(let i=0; i<5; i++) {
                        if (a.allocation[i] === maxUnits[i]) maxTieCounts[i]++;
                    }
                });

                // Calculate my All-vs-All Score
                for(let i=0; i<5; i++) {
                    if (myArr[i] === maxUnits[i] && maxTieCounts[i] > 0) {
                        allVsAllScore += (i + 1) / maxTieCounts[i];
                    }
                }

                // 2. 1v1 Matches (Standard and Modified)
                otherAllocs.forEach(opp => {
                    const oppArr = opp.allocation;
                    let myPts = 0;
                    let oppPts = 0;

                    for(let i=0; i<5; i++) {
                        if (myArr[i] > oppArr[i]) myPts += (i + 1);
                        else if (oppArr[i] > myArr[i]) oppPts += (i + 1);
                        else {
                            myPts += (i + 1) / 2;
                            oppPts += (i + 1) / 2;
                        }
                    }

                    // Standard Result
                    if (myPts > oppPts) standard.w++;
                    else if (oppPts > myPts) standard.l++;
                    else standard.t++;

                    // Modified Result (must have > opp AND >= 6 pts)
                    if (myPts > oppPts && myPts >= 6) modified.w++;
                    else if (oppPts > myPts && oppPts >= 6) modified.l++;
                    else modified.t++;
                });

                return { standard, modified, allVsAllScore };

            }, [selectedAlloc, allocations]);

            if (userAllocs.length === 0) {
                return (
                    <div className="text-center py-12 text-gray-500">
                        <svg className="mx-auto h-12 w-12 text-gray-400 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                        </svg>
                        <p className="text-lg font-medium">No deployments found.</p>
                        <p className="text-sm mt-2">Enter a new allocation to see results.</p>
                    </div>
                );
            }

            return (
                <div className="space-y-6">
                    {/* Selector */}
                    <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                        <label className="block text-sm font-medium text-gray-700 mb-2">Analyze Deployment:</label>
                        <select 
                            className="w-full p-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 bg-gray-50"
                            value={selectedId}
                            onChange={(e) => setSelectedId(e.target.value)}
                        >
                            {userAllocs.map(a => (
                                <option key={a.id} value={a.id}>
                                    {a.username} [{a.allocation.join(', ')}]
                                </option>
                            ))}
                        </select>
                    </div>

                    {stats && stats.standard.total === 0 && (
                        <div className="bg-blue-50 text-blue-800 p-4 rounded-xl text-center border border-blue-200">
                            You are the first player in the database! Wait for others to deploy to see 1v1 matchups.
                        </div>
                    )}

                    {/* All-vs-All Card */}
                    {stats && (
                        <div className="bg-gradient-to-br from-indigo-500 to-purple-600 text-white p-6 rounded-2xl shadow-lg relative overflow-hidden">
                            <div className="relative z-10 text-center">
                                <h3 className="text-indigo-100 font-medium uppercase tracking-wider text-sm mb-1">All-vs-All Global Score</h3>
                                <div className="text-5xl font-black">{stats.allVsAllScore.toFixed(2)} <span className="text-2xl font-medium opacity-75">pts</span></div>
                                <p className="text-xs text-indigo-200 mt-3 opacity-90 max-w-xs mx-auto">
                                    Points earned by matching the highest unit count played across all players per battlefield, split by ties.
                                </p>
                            </div>
                            <svg className="absolute right-0 bottom-0 opacity-10 transform translate-x-4 translate-y-4" width="120" height="120" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" />
                            </svg>
                        </div>
                    )}

                    {/* 1v1 Stats Cards */}
                    {stats && stats.standard.total > 0 && (
                        <div className="space-y-4">
                            <ResultCard 
                                title="Standard 1v1 Matchups" 
                                description={`Against all ${stats.standard.total} other deployments`}
                                stats={stats.standard} 
                            />
                            
                            <ResultCard 
                                title="Modified 1v1 Matchups" 
                                description="Requires strictly > points AND ≥ 6 points to Win"
                                stats={stats.modified} 
                            />
                        </div>
                    )}
                </div>
            );
        };

        const ResultCard = ({ title, description, stats }) => {
            const { w, l, t, total } = stats;
            const wp = total > 0 ? (w / total) * 100 : 0;
            const tp = total > 0 ? (t / total) * 100 : 0;
            const lp = total > 0 ? (l / total) * 100 : 0;

            return (
                <div className="bg-white p-5 rounded-2xl shadow-md border border-gray-100">
                    <div className="mb-4">
                        <h3 className="font-bold text-gray-900 text-lg">{title}</h3>
                        <p className="text-xs text-gray-500">{description}</p>
                    </div>

                    {/* Numbers Row */}
                    <div className="flex justify-between text-center mb-3">
                        <div className="flex-1">
                            <div className="text-2xl font-bold text-green-600">{w}</div>
                            <div className="text-xs uppercase tracking-wider text-gray-500">Wins</div>
                        </div>
                        <div className="flex-1 border-x border-gray-100">
                            <div className="text-2xl font-bold text-gray-400">{t}</div>
                            <div className="text-xs uppercase tracking-wider text-gray-500">Ties</div>
                        </div>
                        <div className="flex-1">
                            <div className="text-2xl font-bold text-red-500">{l}</div>
                            <div className="text-xs uppercase tracking-wider text-gray-500">Losses</div>
                        </div>
                    </div>

                    {/* Bar Chart */}
                    <div className="h-4 w-full bg-gray-100 rounded-full overflow-hidden flex">
                        {wp > 0 && <div className="chart-bar h-full bg-green-500" style={{ width: `${wp}%` }}></div>}
                        {tp > 0 && <div className="chart-bar h-full bg-gray-300" style={{ width: `${tp}%` }}></div>}
                        {lp > 0 && <div className="chart-bar h-full bg-red-500" style={{ width: `${lp}%` }}></div>}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
